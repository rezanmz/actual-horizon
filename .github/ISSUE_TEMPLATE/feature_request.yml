name: Feature request
description: Propose a slice of work for Actual Horizon
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: What user need does this serve? Keep it generic — no personal data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Endpoints, UI, or behavior. Note any API-contract or math impact.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [server, web, auth, actual-sync, ci, docs]
    validations:
      required: true
