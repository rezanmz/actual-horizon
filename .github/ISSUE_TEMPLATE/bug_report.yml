name: Bug report
description: Something broken in Actual Horizon
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw vs what you expected. No personal data or real budget exports.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, sample config, version/commit.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: e.g. v0.3.0 or main @ abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [server, web, auth, actual-sync, ci, docs]
    validations:
      required: true
